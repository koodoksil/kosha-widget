name: Build Kosha Widget Ver3 APK and Play Store AAB



on:

  push:

  workflow_dispatch:



jobs:

  build:

    runs-on: ubuntu-latest

    steps:

      - name: Decode Android Project Ver 3.1

        run: |

          echo "" | base64 -d > project.zip

          unzip -q project.zip



      - name: Set up JDK 17

        uses: actions/setup-java@v4

        with:

          java-version: '17'

          distribution: 'temurin'



      - name: Setup Gradle

        uses: gradle/actions/setup-gradle@v3

        with:

          gradle-version: '8.5'

          cache-disabled: true



      - name: Build Debug APK and Release AAB

        working-directory: KoshaAccidentWidget

        run: gradle assembleDebug bundleRelease --no-daemon



      - name: Upload Ver3 APK and AAB Artifact

        uses: actions/upload-artifact@v4

        with:

          name: KoshaAccidentWidget-v3-APK

          path: |

            KoshaAccidentWidget/app/build/outputs/apk/debug/app-debug.apk

            KoshaAccidentWidget/app/build/outputs/bundle/release/app-release.aab

