name: Build Kosha Widget APK

on:
  push:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Decode Android Project
        run: |
          echo "" | base64 -d > project.zip
          unzip -q project.zip

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v3
        with:
          gradle-version: '8.5'

      - name: Build Debug APK
        working-directory: KoshaAccidentWidget
        run: gradle assembleDebug --no-daemon

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: KoshaAccidentWidget-APK
          path: KoshaAccidentWidget/app/build/outputs/apk/debug/app-debug.apk
